name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run types -w @track-social/api
      - run: npm run typecheck
      - run: npm exec --workspace @track-social/api -- wrangler deploy --env staging --dry-run
